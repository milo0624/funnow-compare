name: 更新 FunNow 價格

on:
  workflow_dispatch:         # 只在 Actions 頁面按 Run workflow 時執行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓價格
        run: python scrape.py
      - name: 存回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "更新價格 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git push
